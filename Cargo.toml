[workspace]
members = ["crates/qsonaut-third-party", "crates/qsonaut-n3fjp"]
resolver = "2"

# Resolve sibling RigForge checkouts locally for development and tests.
[patch."https://github.com/nicksbar/qsonaut-modems.git"]
qsonaut-modems = { path = "../qsonaut-modems/crates/qsonaut-modems" }

[patch."https://github.com/jl1nie/mfsk-core.git"]
mfsk-core = { path = "../mfsk-core/mfsk-core" }

[patch."https://github.com/swilcox/cw-dit.git"]
cwdit-dsp = { path = "../cw-dit/cwdit-dsp" }
cwdit-morse = { path = "../cw-dit/cwdit-morse" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["QSONaut Contributors"]

[workspace.dependencies]
qsonaut-modems = { git = "https://github.com/nicksbar/qsonaut-modems.git", rev = "c93660a34b9ed65ea1eb46df57ffc856eb68e797" }
# Keep the adapter reproducible while retaining the local sibling patch above
# for development checkouts.
mfsk-core = { git = "https://github.com/jl1nie/mfsk-core.git", rev = "ce9affcfd0c9c5205bbe464224e1c3ca55dafba5", default-features = false, features = ["full"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
komitoto-sstv = { git = "https://github.com/IRendy/komitoto.git", rev = "c98945f7c89f714b3182457a86b15a0c43cb6de6" }
cwdit-dsp = { git = "https://github.com/swilcox/cw-dit.git", rev = "153fc247ce6e4934c94e0cd2dcbf7887e368ec29" }
cwdit-morse = { git = "https://github.com/swilcox/cw-dit.git", rev = "153fc247ce6e4934c94e0cd2dcbf7887e368ec29" }
