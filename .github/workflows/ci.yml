name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout local workspace dependencies
        uses: actions/checkout@v4
        with:
          repository: nicksbar/qsonaut-modems
          ref: c93660a34b9ed65ea1eb46df57ffc856eb68e797
          path: ci-deps/qsonaut-modems
      - uses: actions/checkout@v4
        with:
          repository: jl1nie/mfsk-core
          ref: main
          path: ci-deps/mfsk-core
      - uses: actions/checkout@v4
        with:
          repository: swilcox/cw-dit
          ref: main
          path: ci-deps/cw-dit
      - name: Link local workspace dependencies
        run: |
          ln -s "$GITHUB_WORKSPACE/ci-deps/qsonaut-modems" "$GITHUB_WORKSPACE/../qsonaut-modems"
          ln -s "$GITHUB_WORKSPACE/ci-deps/mfsk-core" "$GITHUB_WORKSPACE/../mfsk-core"
          ln -s "$GITHUB_WORKSPACE/ci-deps/cw-dit" "$GITHUB_WORKSPACE/../cw-dit"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install RADE native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - name: Build pinned RADE native dependency
        run: |
          ./tools/build-rade-c.sh | tee rade-build-output.txt
          grep -E '^(RADE_C_DIR|RADE_C_BUILD_DIR|RADE_C_LIB_DIR)=' rade-build-output.txt >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(grep '^RADE_C_LIB_DIR=' rade-build-output.txt | cut -d= -f2)" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo metadata --locked --no-deps
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
